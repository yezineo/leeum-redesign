{% extends "base_account.html" %}

{% block title %}비밀번호 재설정 | 리움미술관{% endblock %}

{% block content %}
<div class="account__box">
    <form class="account__form" action="#" method="post" novalidate data-validate data-next="{{ url_for('login') }}">
        <h2 class="account__title">비밀번호 재설정</h2>
        <p class="account__desc">새로 사용할 비밀번호를 입력해 주세요.</p>

        <div class="account__fields">
            <div class="field">
                <input class="input" type="password" name="password" placeholder="새 비밀번호" aria-label="새 비밀번호" aria-describedby="pw-hint">
                <p class="field__hint" id="pw-hint">8자 이상 · 영문과 숫자 포함</p>
            </div>

            <div class="field">
                <input class="input {{ 'is-error' if mismatch }}" type="password" name="password_check"
                       placeholder="새 비밀번호 확인" aria-label="새 비밀번호 확인"
                       {% if mismatch %}aria-invalid="true" aria-describedby="pw-error"{% endif %}>
                {% if mismatch %}
                <p class="field__error" id="pw-error">비밀번호가 일치하지 않습니다.</p>
                {% endif %}
            </div>

            <button type="submit" class="account__submit">비밀번호 변경</button>
        </div>
    </form>

    <hr class="account__line account__line--20">

    <a href="{{ url_for('login') }}" class="account__back">로그인으로 돌아가기</a>
</div>
{% endblock %}
