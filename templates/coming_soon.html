    .coming-soon p { margin: 16px 0 32px; color: #777; line-height: 1.6; }
</style>
{% endblock %}

{% block content %}
<div class="page coming-soon">

    <a href="{{ url_for('index') }}" class="btn-chip">메인으로</a>

{% endblock %}
