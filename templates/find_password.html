{% extends "base_account.html" %}

{% block title %}비밀번호 찾기 | 리움미술관{% endblock %}

{% block content %}
<div class="account__box">
    {% if sent %}
    {# 05-1 전송 후 #}
    <img class="account__icon" src="{{ url_for('static', filename='images/icons/icon-send.svg') }}" alt="">
    <h2 class="account__title">비밀번호 찾기</h2>
    <div class="account__info">
        <p>입력하신 이메일로 재설정 링크를 보내드렸습니다.</p>
        <p class="account__info-sub">메일이 오지 않으면 주소와 스팸함을 확인해 주세요.</p>
    </div>
    {% else %}
    {# 05 입력 #}
    <form class="account__form" action="#" method="post">
        <h2 class="account__title">비밀번호 찾기</h2>
        <p class="account__desc">가입하신 이메일 주소를 입력해 주세요.</p>

        <div class="account__fields">
            <input class="input" type="email" name="email" placeholder="이메일" aria-label="이메일">
            <button type="submit" class="account__submit">비밀번호 재설정</button>
        </div>
    </form>
    {% endif %}

    <hr class="account__line account__line--20">

    <a href="{{ url_for('login') }}" class="account__back">로그인으로 돌아가기</a>
</div>
{% endblock %}
