<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}리움미술관{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/common.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/account.css') }}">
</head>
<body>
    <header class="header header--account">
        <a href="/" class="header__logo" aria-label="리움미술관 홈">{% include "partials/logo.svg" %}</a>
    </header>

    <main class="account">
        {% block content %}{% endblock %}
    </main>
    
    <script src="{{ url_for('static', filename='js/account.js') }}"></script>
</body>
</html>
